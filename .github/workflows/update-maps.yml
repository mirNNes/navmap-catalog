name: Update Garmin Map Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  update-maps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate map catalog
        run: node scripts/fetch-maps.cjs

      - name: Merge catalogs
        run: node merge-catalog.cjs

      - name: Validate catalog
        run: node scripts/validate-maps.cjs

      - name: Publish validated catalog
        run: |
          mv maps.merged.json maps.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Garmin map catalog"
            git push
          fi
